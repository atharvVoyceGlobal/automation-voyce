version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.11
        environment:
          PYTHONPATH: /home/circleci/project
    steps:
      - checkout
      
      # Кэширование зависимостей
      - restore_cache:
          keys:
            - v1-deps-{{ .Branch }}-{{ checksum "requirements.txt" }}
            - v1-deps-{{ .Branch }}
            - v1-deps
      
      - run:
          name: Create and Activate Virtual Environment
          command: |
            python -m venv venv
            echo 'source venv/bin/activate' >> $BASH_ENV
            source $BASH_ENV
      
      - run:
          name: Install Dependencies
          command: |
            # Обновляем систему и устанавливаем базовые зависимости
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg xvfb wget

            # Устанавливаем Python зависимости
            python -m pip install --upgrade pip
            pip install -r requirements.txt

            # Проверяем установку ffmpeg
            ffmpeg -version || echo "ffmpeg не установлен"
            
            # Проверяем установку Xvfb
            which Xvfb || echo "Xvfb не установлен"
      
      # Сохраняем кэш зависимостей
      - save_cache:
          paths:
            - ./venv
          key: v1-deps-{{ .Branch }}-{{ checksum "requirements.txt" }}
      
      - run:
          name: Create Directories
          command: |
            mkdir -p allure-results
            mkdir -p test_results
            mkdir -p test_videos
      
      - run:
          name: Download Test Video
          command: |
            python -c "
            import requests, os
            video_url = 'https://drive.usercontent.google.com/u/0/uc?id=1Rv3Qitap2wANEx0I-7NLvSp1cEQlE6_K&export=download'
            video_path = os.path.join(os.getcwd(), 'output.y4m')
            if not os.path.exists(video_path):
                print('Downloading video...')
                response = requests.get(video_url, stream=True)
                response.raise_for_status()
                with open(video_path, 'wb') as f:
                    for chunk in response.iter_content(chunk_size=8192):
                        f.write(chunk)
                print('Video downloaded successfully')
            else:
                print('Video file already exists')"

      - run:
          name: Verify Installations
          command: |
            echo "=== Проверка установленных компонентов ==="
            
            echo -e "\n=== ffmpeg ==="
            if command -v ffmpeg >/dev/null 2>&1; then
              ffmpeg -version | head -n 1
              echo "ffmpeg установлен успешно"
            else
              echo "ОШИБКА: ffmpeg не установлен"
              exit 1
            fi
            
            echo -e "\n=== Xvfb ==="
            if command -v Xvfb >/dev/null 2>&1; then
              echo "Xvfb установлен успешно"
              Xvfb -help >/dev/null 2>&1 && echo "Xvfb работает корректно"
            else
              echo "ОШИБКА: Xvfb не установлен"
              exit 1
            fi
            
            echo -e "\n=== Проверка переменных окружения ==="
            echo "DISPLAY=$DISPLAY"
            echo "PYTHONPATH=$PYTHONPATH"
            
            echo -e "\n=== Все компоненты установлены успешно ==="

      - run:
          name: Setup Virtual Display
          command: |
            # Убеждаемся, что нет других процессов Xvfb
            pkill Xvfb || true
            
            # Запускаем Xvfb с расширенными параметрами
            Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset >/dev/null 2>&1 &
            
            # Ждем инициализации Xvfb
            sleep 3
            
            # Проверяем, что Xvfb запущен
            if ! ps aux | grep -v grep | grep Xvfb > /dev/null; then
                echo "Ошибка: Xvfb не запущен"
                exit 1
            fi
            
            # Устанавливаем переменную DISPLAY
            echo "export DISPLAY=:99" >> $BASH_ENV
            source $BASH_ENV
            
            echo "Виртуальный дисплей настроен успешно"

      - run:
          name: Run Tests with Screen Recording
          command: |
            # Проверяем переменную DISPLAY
            echo "Используется DISPLAY=$DISPLAY"
            
            # Запускаем тесты
            pytest sqs_kafka_listener.py -v -k test_video_call_activation --alluredir=./allure-results
      
      - store_test_results:
          path: test_results
      
      - store_artifacts:
          path: allure-results
          destination: allure-results
      
      - store_artifacts:
          path: test_results
          destination: test_results
      
      # Сохраняем видео как артефакт
      - store_artifacts:
          path: output.y4m
          destination: test-video
      
      # Сохраняем записи экрана как артефакты
      - store_artifacts:
          path: test_videos
          destination: test-recordings
      
      # Сохраняем отчеты Allure
      - store_artifacts:
          path: allure-results
          destination: allure-results

workflows:
  version: 2
  test:
    jobs:
      - test 