version: 2.1

orbs:
  browser-tools: circleci/browser-tools@1.4.6

jobs:
  test:
    docker:
      - image: cimg/python:3.9-browsers
    environment:
      DISPLAY: ':99'
    steps:
      - checkout
      
      # Установка системных зависимостей
      - run:
          name: Установка системных зависимостей
          command: |
            sudo apt-get update
            sudo apt-get install -y xvfb ffmpeg libgconf-2-4 python3-xvfbwrapper
      
      # Установка Python зависимостей
      - run:
          name: Установка Python зависимостей
          command: |
            python -m pip install --upgrade pip
            pip install pytest selenium allure-pytest requests pyvirtualdisplay
      
      # Создание директорий для результатов
      - run:
          name: Создание директорий для результатов
          command: |
            mkdir -p test-results/pytest
            mkdir -p test-videos
            mkdir -p test-screenshots
      
      # Запуск тестов с записью видео
      - run:
          name: Запуск тестов
          command: |
            # Запускаем Xvfb
            Xvfb :99 -screen 0 1920x1080x24 &
            sleep 2
            
            # Запускаем тесты с переменной CI=true
            CI=true pytest sqs_kafka_listener.py -v
      
      # Сохранение результатов тестов
      - store_test_results:
          path: test-results
      
      # Сохранение артефактов (видео, скриншоты)
      - store_artifacts:
          path: test-videos
          destination: test-videos
      - store_artifacts:
          path: test-screenshots
          destination: test-screenshots

workflows:
  version: 2
  test:
    jobs:
      - test 