version: 2.1

jobs:
  trigger-jenkins:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Install jq
          command: |
            sudo apt-get update
            sudo apt-get install -y jq
      
      - run:
          name: Trigger Jenkins Job
          command: |
            JENKINS_CRUMB=$(curl -s --user ${JENKINS_USER}:${JENKINS_API_TOKEN} \
              "${JENKINS_URL}/crumbIssuer/api/xml?xpath=concat(//crumbRequestField,\":\",//crumb)" || echo "Jenkins-Crumb:")
            
            if ! curl -s --head "${JENKINS_URL}" > /dev/null; then
              echo "Error: Cannot connect to Jenkins at ${JENKINS_URL}"
              exit 1
            fi
            
            LAST_BUILD_RESPONSE=$(curl -s --user ${JENKINS_USER}:${JENKINS_API_TOKEN} \
              "${JENKINS_URL}/job/Pipe/lastBuild/api/json")
            
            echo "Jenkins response for last build:"
            echo "$LAST_BUILD_RESPONSE"
            
            if ! echo "$LAST_BUILD_RESPONSE" | jq empty; then
              echo "Error: Invalid JSON response from Jenkins"
              exit 1
            fi
            
            LAST_BUILD_NUMBER=$(echo "$LAST_BUILD_RESPONSE" | jq -r '.number')
            echo "Current last build: #$LAST_BUILD_NUMBER"
            
            PARAMS="{"
            PARAMS+="\"parameter\": ["
            PARAMS+="  {\"name\": \"AGENT_URL\", \"value\": \"${AGENT_URL}\"},"
            PARAMS+="  {\"name\": \"CUSTOMER_URL\", \"value\": \"${CUSTOMER_URL}\"},"
            PARAMS+="  {\"name\": \"AGENT_LOGIN\", \"value\": \"${AGENT_LOGIN}\"},"
            PARAMS+="  {\"name\": \"AGENT_PASSWORD\", \"value\": \"${AGENT_PASSWORD}\"},"
            PARAMS+="  {\"name\": \"AGENT_ALT_LOGIN\", \"value\": \"${AGENT_ALT_LOGIN}\"},"
            PARAMS+="  {\"name\": \"OPERATOR_LOGIN\", \"value\": \"${OPERATOR_LOGIN}\"},"
            PARAMS+="  {\"name\": \"AGENT_ALT_PASSWORD\", \"value\": \"${AGENT_ALT_PASSWORD}\"},"
            PARAMS+="  {\"name\": \"OPERATOR_PASSWORD\", \"value\": \"${OPERATOR_PASSWORD}\"},"
            PARAMS+="  {\"name\": \"CUSTOMER_LOGIN\", \"value\": \"${CUSTOMER_LOGIN}\"}"
            PARAMS+="]}"
            
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              --user ${JENKINS_USER}:${JENKINS_API_TOKEN} \
              "${JENKINS_URL}/job/Pipe/buildWithParameters" \
              --data-urlencode json="$PARAMS" \
              --header "$JENKINS_CRUMB")
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            if [[ $HTTP_CODE != "201" ]]; then
              echo "Error starting Jenkins job. HTTP code: $HTTP_CODE"
              echo "Full response: $RESPONSE"
              exit 1
            fi
            
            echo "Jenkins job started successfully"
            
            sleep 10
            NEW_BUILD_NUMBER=$((LAST_BUILD_NUMBER + 1))
            echo "Expected new build number: #$NEW_BUILD_NUMBER"
            
            echo $NEW_BUILD_NUMBER > /tmp/build_number
      
      - run:
          name: Wait for Jenkins Job
          command: |
            BUILD_NUMBER=$(cat /tmp/build_number)
            echo "Tracking build #$BUILD_NUMBER"
            
            JENKINS_CRUMB=$(curl -s --user ${JENKINS_USER}:${JENKINS_API_TOKEN} \
              "${JENKINS_URL}/crumbIssuer/api/xml?xpath=concat(//crumbRequestField,\":\",//crumb)" || echo "Jenkins-Crumb:")
            
            MAX_ATTEMPTS=60
            ATTEMPT=0
            
            while true; do
              if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
                echo "Timeout exceeded (30 minutes)"
                exit 1
              fi
              
              RESPONSE=$(curl -s --user ${JENKINS_USER}:${JENKINS_API_TOKEN} \
                --header "$JENKINS_CRUMB" \
                "${JENKINS_URL}/job/Pipe/${BUILD_NUMBER}/api/json")
              
              echo "Raw response from Jenkins:"
              echo "$RESPONSE"
              
              if [ -z "$RESPONSE" ]; then
                echo "Waiting for build #${BUILD_NUMBER} creation..."
                sleep 10
                ATTEMPT=$((ATTEMPT + 1))
                continue
              fi
              
              if ! echo "$RESPONSE" | jq empty; then
                echo "Error: Invalid JSON received from Jenkins"
                echo "Full response: $RESPONSE"
                sleep 10
                ATTEMPT=$((ATTEMPT + 1))
                continue
              fi
              
              BUILDING=$(echo "$RESPONSE" | jq -r '.building')
              STATUS=$(echo "$RESPONSE" | jq -r '.result')
              
              echo "Build status #${BUILD_NUMBER}:"
              echo "Building: $BUILDING"
              echo "Result: $STATUS"
              
              if [ "$BUILDING" = "true" ]; then
                echo "Jenkins job #${BUILD_NUMBER} is still running..."
                sleep 30
                ATTEMPT=$((ATTEMPT + 1))
                continue
              fi
              
              case $STATUS in
                "SUCCESS")
                  echo "Jenkins job #${BUILD_NUMBER} completed successfully!"
                  exit 0
                  ;;
                "FAILURE")
                  echo "Jenkins job #${BUILD_NUMBER} failed!"
                  echo "Details: $RESPONSE"
                  exit 1
                  ;;
                "ABORTED")
                  echo "Jenkins job #${BUILD_NUMBER} was aborted!"
                  echo "Details: $RESPONSE"
                  exit 1
                  ;;
                "null")
                  if [ "$BUILDING" = "false" ]; then
                    echo "Strange state: building=false, but status=null"
                    echo "Full response: $RESPONSE"
                    sleep 30
                    ATTEMPT=$((ATTEMPT + 1))
                  else
                    echo "Jenkins job is still running..."
                    sleep 30
                    ATTEMPT=$((ATTEMPT + 1))
                  fi
                  ;;
                *)
                  echo "Unknown status: $STATUS"
                  echo "Full response: $RESPONSE"
                  exit 1
                  ;;
              esac
            done

workflows:
  version: 2
  build:
    jobs:
      - trigger-jenkins
  
  scheduled-workflow:
    triggers:
      - schedule:
          cron: "1 16 * * *"
          filters:
            branches:
              only:
                - video_call_test_new
    jobs:
      - trigger-jenkins:
          context: jenkins-context 