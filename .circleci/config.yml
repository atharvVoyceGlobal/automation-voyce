version: 2.1

jobs:
  trigger-jenkins:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Install jq
          command: |
            sudo apt-get update
            sudo apt-get install -y jq
      
      - run:
          name: Trigger Jenkins Job
          command: |
            # Получаем CRUMB
            JENKINS_CRUMB=$(curl -s --user ${JENKINS_USER}:${JENKINS_API_TOKEN} \
              "${JENKINS_URL}/crumbIssuer/api/xml?xpath=concat(//crumbRequestField,\":\",//crumb)" || echo "Jenkins-Crumb:")
            
            # Проверяем подключение к Jenkins
            if ! curl -s --head "${JENKINS_URL}" > /dev/null; then
              echo "Ошибка: Не могу подключиться к Jenkins по адресу ${JENKINS_URL}"
              exit 1
            fi
            
            # Получаем номер последнего билда перед запуском
            LAST_BUILD_RESPONSE=$(curl -s --user ${JENKINS_USER}:${JENKINS_API_TOKEN} \
              "${JENKINS_URL}/job/Pipe/lastBuild/api/json")
            
            echo "Ответ от Jenkins для последнего билда:"
            echo "$LAST_BUILD_RESPONSE"
            
            if ! echo "$LAST_BUILD_RESPONSE" | jq empty; then
              echo "Ошибка: Невалидный JSON ответ от Jenkins"
              exit 1
            fi
            
            LAST_BUILD_NUMBER=$(echo "$LAST_BUILD_RESPONSE" | jq -r '.number')
            echo "Текущий последний билд: #$LAST_BUILD_NUMBER"
            
            # Используем curl для вызова Jenkins API
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              --user ${JENKINS_USER}:${JENKINS_API_TOKEN} \
              "${JENKINS_URL}/job/Pipe/build" \
              --header "$JENKINS_CRUMB")
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            if [[ $HTTP_CODE != "201" ]]; then
              echo "Ошибка при запуске Jenkins job. HTTP код: $HTTP_CODE"
              echo "Полный ответ: $RESPONSE"
              exit 1
            fi
            
            echo "Jenkins job успешно запущен"
            
            # Ждем появления нового билда
            sleep 10  # Увеличиваем время ожидания для инициализации
            NEW_BUILD_NUMBER=$((LAST_BUILD_NUMBER + 1))
            echo "Ожидаемый номер нового билда: #$NEW_BUILD_NUMBER"
            
            # Сохраняем номер нового билда в файл
            echo $NEW_BUILD_NUMBER > /tmp/build_number
      
      - run:
          name: Wait for Jenkins Job
          command: |
            # Получаем номер билда из предыдущего шага
            BUILD_NUMBER=$(cat /tmp/build_number)
            echo "Отслеживаем билд #$BUILD_NUMBER"
            
            # Получаем CRUMB для проверки статуса
            JENKINS_CRUMB=$(curl -s --user ${JENKINS_USER}:${JENKINS_API_TOKEN} \
              "${JENKINS_URL}/crumbIssuer/api/xml?xpath=concat(//crumbRequestField,\":\",//crumb)" || echo "Jenkins-Crumb:")
            
            # Максимальное время ожидания (30 минут)
            MAX_ATTEMPTS=60
            ATTEMPT=0
            
            # Ждем завершения job и проверяем статус
            while true; do
              if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
                echo "Превышено время ожидания (30 минут)"
                exit 1
              fi
              
              RESPONSE=$(curl -s --user ${JENKINS_USER}:${JENKINS_API_TOKEN} \
                --header "$JENKINS_CRUMB" \
                "${JENKINS_URL}/job/Pipe/${BUILD_NUMBER}/api/json")
              
              echo "Сырой ответ от Jenkins:"
              echo "$RESPONSE"
              
              if [ -z "$RESPONSE" ]; then
                echo "Ожидание создания билда #${BUILD_NUMBER}..."
                sleep 10
                ATTEMPT=$((ATTEMPT + 1))
                continue
              fi
              
              # Проверяем, что ответ является валидным JSON
              if ! echo "$RESPONSE" | jq empty; then
                echo "Ошибка: Получен невалидный JSON от Jenkins"
                echo "Полный ответ: $RESPONSE"
                sleep 10
                ATTEMPT=$((ATTEMPT + 1))
                continue
              fi
              
              # Получаем больше информации о сборке
              BUILDING=$(echo "$RESPONSE" | jq -r '.building')
              STATUS=$(echo "$RESPONSE" | jq -r '.result')
              
              echo "Статус сборки #${BUILD_NUMBER}:"
              echo "Building: $BUILDING"
              echo "Result: $STATUS"
              
              if [ "$BUILDING" = "true" ]; then
                echo "Jenkins job #${BUILD_NUMBER} все еще выполняется..."
                sleep 30
                ATTEMPT=$((ATTEMPT + 1))
                continue
              fi
              
              case $STATUS in
                "SUCCESS")
                  echo "Jenkins job #${BUILD_NUMBER} completed successfully!"
                  exit 0
                  ;;
                "FAILURE")
                  echo "Jenkins job #${BUILD_NUMBER} failed!"
                  echo "Подробности: $RESPONSE"
                  exit 1
                  ;;
                "ABORTED")
                  echo "Jenkins job #${BUILD_NUMBER} was aborted!"
                  echo "Подробности: $RESPONSE"
                  exit 1
                  ;;
                "null")
                  if [ "$BUILDING" = "false" ]; then
                    echo "Странное состояние: building=false, но status=null"
                    echo "Полный ответ: $RESPONSE"
                    sleep 30
                    ATTEMPT=$((ATTEMPT + 1))
                  else
                    echo "Jenkins job is still running..."
                    sleep 30
                    ATTEMPT=$((ATTEMPT + 1))
                  fi
                  ;;
                *)
                  echo "Unknown status: $STATUS"
                  echo "Full response: $RESPONSE"
                  exit 1
                  ;;
              esac
            done

workflows:
  version: 2
  build:
    jobs:
      - trigger-jenkins
  
  # Добавляем новый workflow для запуска по расписанию
  scheduled-workflow:
    triggers:
      - schedule:
          cron: "50 15 * * *"  # 10:50 EST = 15:50 UTC
          filters:
            branches:
              only:
                - main  # или master, в зависимости от вашей основной ветки
    jobs:
      - trigger-jenkins 